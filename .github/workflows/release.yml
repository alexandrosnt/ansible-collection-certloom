name: release

# Publishes the collection to Ansible Galaxy when a version tag (v1.2.3) is
# pushed. The tag must match the version in galaxy.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install "ansible-core~=2.22.0"
      - name: check the version
        run: |
          version=$(sed -n 's/^version: //p' galaxy.yml)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match galaxy.yml version $version" >&2; exit 1; }
      - name: build
        run: ansible-galaxy collection build
      - name: publish to Galaxy
        run: ansible-galaxy collection publish certloom-certloom-*.tar.gz --api-key "$GALAXY_API_KEY"
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" certloom-certloom-*.tar.gz --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
