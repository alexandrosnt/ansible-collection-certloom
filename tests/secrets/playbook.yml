---
# Exercises every option that carries a secret. run.sh runs this with -vvv
# and --diff, in normal and check mode, and fails if a secret shows up in
# the output.
- hosts: localhost
  gather_facts: false
  module_defaults:
    group/certloom.certloom.certloom:
      url: "{{ lookup('env', 'CERTLOOM_ENDPOINT') }}"
      token: "{{ lookup('env', 'CERTLOOM_TOKEN') }}"
  vars:
    eab_hmac: "{{ lookup('env', 'SCAN_EAB_HMAC') }}"
    pool_hmac: "{{ lookup('env', 'SCAN_POOL_HMAC') }}"
    dns_secret: "{{ lookup('env', 'SCAN_DNS_SECRET') }}"
  tasks:
    - certloom.certloom.issuer:
        name: scan-issuer
        directory_url: https://acme.example.test/directory
        agree_tos: true
        eab_mode: reusable
        eab_kid: scan-kid
        eab_hmac: "{{ eab_hmac }}"
        update_secret: always

    - certloom.certloom.issuer:
        name: scan-pool
        directory_url: https://acme.example.test/directory
        agree_tos: true
        eab_mode: single_use

    - certloom.certloom.issuer_eab_key: {issuer: scan-pool, kid: scan-key, hmac: "{{ pool_hmac }}"}

    - certloom.certloom.dns_solver:
        name: scan-solver
        provider: cloudflare
        zones: [scan.example.test]
        secret: {api_token: "{{ dns_secret }}"}
        update_secret: always

    - certloom.certloom.agent_enrollment_token: {name: scan-agent}
      register: enroll
      no_log: true

    - name: Keep the token for the scan
      ansible.builtin.copy:
        content: "{{ enroll.token | default('') }}"
        dest: "{{ lookup('env', 'SCAN_TOKEN_FILE') }}"
        mode: '0600'
      no_log: true
      when: not ansible_check_mode
