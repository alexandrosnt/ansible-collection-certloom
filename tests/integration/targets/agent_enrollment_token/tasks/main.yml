---
- module_defaults:
    group/certloom.certloom.certloom:
      url: "{{ certloom_url }}"
      token: "{{ certloom_token }}"
  block:
    - name: Check mode creates nothing
      certloom.certloom.agent_enrollment_token: {name: it-agent}
      check_mode: true
      register: check

    - name: Create
      certloom.certloom.agent_enrollment_token: {name: it-agent, ttl_seconds: 300}
      register: token
      no_log: true

    - name: Too long
      certloom.certloom.agent_enrollment_token: {ttl_seconds: 7200}
      register: long
      ignore_errors: true

    - assert:
        that:
          - check is changed
          - check.token is not defined
          - token is changed
          - token.token | length > 20
          - token.ca_hash is match('sha256:')
          - long is failed

    - certloom.certloom.agent_info: {}
      register: agents

    - assert:
        that: [agents.agents is sequence]
