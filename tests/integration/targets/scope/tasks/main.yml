---
- module_defaults:
    group/alexandrosnt.certloom.certloom:
      url: "{{ certloom_url }}"
      token: "{{ certloom_token }}"
  block:
    - name: Create
      alexandrosnt.certloom.scope: {name: it-scope, allow_hosts: [www.example.test], ports: [443]}
      register: create

    - name: Create again
      alexandrosnt.certloom.scope: {name: it-scope, allow_hosts: [www.example.test], ports: [443]}
      register: again

    - name: Allow private addresses, keep the rest
      alexandrosnt.certloom.scope: {name: it-scope, allow_private: true}
      register: update

    - name: Same again
      alexandrosnt.certloom.scope: {name: it-scope, allow_private: true}
      register: update_again

    - alexandrosnt.certloom.scope_info: {name: it-scope}
      register: info

    - assert:
        that:
          - create is changed
          - again is not changed
          - update is changed
          - update_again is not changed
          - info.scopes[0].config.allow_hosts == ['www.example.test']
          - info.scopes[0].config.allow_private

  always:
    - alexandrosnt.certloom.scope: {name: it-scope, state: absent}
