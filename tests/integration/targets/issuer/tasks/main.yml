---
- module_defaults:
    group/alexandrosnt.certloom.certloom:
      url: "{{ certloom_url }}"
      token: "{{ certloom_token }}"
  block:
    - set_fact:
        hmac: "{{ 'issuer-integration-test-hmac' | b64encode | replace('=', '') }}"
        hmac2: "{{ 'second-integration-test-hmac' | b64encode | replace('=', '') }}"
      no_log: true

    - name: Create
      alexandrosnt.certloom.issuer:
        name: it-issuer
        directory_url: https://acme.example.test/directory
        email: pki@example.test
        agree_tos: true
      register: create

    - name: Create again
      alexandrosnt.certloom.issuer: {name: it-issuer, directory_url: https://acme.example.test/directory, email: pki@example.test}
      register: again

    - name: Different directory
      alexandrosnt.certloom.issuer: {name: it-issuer, directory_url: https://other.example.test/directory}
      register: directory
      ignore_errors: true

    - name: Set up EAB
      alexandrosnt.certloom.issuer: {name: it-issuer, eab_mode: reusable, eab_kid: kid-1, eab_hmac: "{{ hmac }}"}
      register: eab

    - name: EAB again
      alexandrosnt.certloom.issuer: {name: it-issuer, eab_mode: reusable, eab_kid: kid-1, eab_hmac: "{{ hmac }}"}
      register: eab_again

    - name: Rotate the HMAC
      alexandrosnt.certloom.issuer: {name: it-issuer, eab_mode: reusable, eab_kid: kid-1, eab_hmac: "{{ hmac2 }}", update_secret: always}
      register: rotate

    - alexandrosnt.certloom.issuer_info: {name: it-issuer}
      register: info

    - assert:
        that:
          - create is changed
          - again is not changed
          - directory is failed
          - eab is changed
          - eab.issuer.eab_mode == 'reusable'
          - eab.issuer.has_eab_hmac
          - eab_again is not changed
          - rotate is changed
          - info.issuers | length == 1
          - hmac not in (eab | to_json)

  always:
    - alexandrosnt.certloom.issuer: {name: it-issuer, state: absent}
